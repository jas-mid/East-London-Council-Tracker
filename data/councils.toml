# Council reference data.
#
# Adding a council, a kind of link, or a grouping is a data change only: no
# Python needs editing. The loader validates this file on startup, and the
# test suite loads it too, so a typo fails `pytest` rather than the live app.
#
# GSS codes are the ONS identifiers and are the join key for ONS data.
# URLs last verified: 2026-10-06.

# --- Link kinds: the categories of council page the app can display --------

[[link_kinds]]
key = "contact"
label = "Contact Information"
icon = "📱"
blurb = "Raise an issue or give feedback directly to your council."
order = 10

[[link_kinds]]
key = "voting"
label = "Voting Information"
icon = "✉️"
blurb = "Register to vote and find out about upcoming local elections."
order = 20

# --- Groups: named sets of councils. A council can be in any number. -------
# "East London" is this project's own selection, not an official sub-region.

[groups.east_london]
label = "East London"
members = [
    "E09000002", # Barking & Dagenham
    "E09000012", # Hackney
    "E09000016", # Havering
    "E09000025", # Newham
    "E09000026", # Redbridge
    "E09000030", # Tower Hamlets
    "E09000031", # Waltham Forest
]

# --- Councils ----------------------------------------------------------------

